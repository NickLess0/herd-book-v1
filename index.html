/* ---------------- actions ---------------- */
const ACT = {
  back: () => back(),
  lang: ds => { setLang(ds.v); render(); },
  addNew: () => guardLeave(() => go({s:'form'})),
  filterAnimals: ds => go({s:'animals', st: ds.f === 'all' ? 'any' : ds.f}, {root:true}),
  homeType: ds => { cur().type = ds.v; render(); },
  animalsType: ds => { cur().type = ds.v; render(); },
  atab: ds => { const r = cur(); r.tab = ds.v; const y = window.scrollY; render(); const st = $('#subtabs'); if(st){ const top = st.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo(0, Math.min(y, Math.max(0, top))); } },
  vtab: ds => { cur().tab = ds.v; render(); },
  editAnimal: ds => go({s:'form', id:ds.id}),
  viewPhoto: ds => viewPhoto(ds.id),
  addStatus: ds => sheetAddStatus(ds.id),
  removeStatus: ds => sheetRemoveStatus(ds.id, ds.st),
  giveVax: ds => sheetVax(ds.id, ds.rule),
  delVax: ds => {
    const a = animal(ds.id); const v = a && (a.vaccinations || []).find(x => x.id === ds.v); if(!v) return;
    confirmSheet({title:t('delVaxQ'), body:t('delVaxBody', {s:vxName(v), x:label(a), d:fmtDate(v.date)}), yes:t('delRecordBtn'), danger:true, onYes(){ const x = clone(a); x.vaccinations = x.vaccinations.filter(y => y.id !== ds.v); Store.put('animals', a.id, x); toast(t('recordDeleted')); }});
  },
  addOffspring: ds => {
    const a = animal(ds.id); if(!a) return;
    go({s:'form', preset:{speciesId:a.speciesId, damId:a.sex === 'F' ? a.id : '', sireId:a.sex === 'M' ? a.id : '', breed:a.breed || ''}});
  },
  linkDam: ds => linkParent(ds.id, 'F'),
  linkSire: ds => linkParent(ds.id, 'M'),
  linkChild: ds => {
    const p = animal(ds.id); if(!p) return;
    const key = p.sex === 'F' ? 'damId' : 'sireId';
    const block = ancestors(p.id); block.add(p.id);
    const cands = A().filter(x => x.speciesId === p.speciesId && !block.has(x.id) && x[key] !== p.id).sort(byTag);
    pickAnimal({title:t('linkOffspringTo', {x:p.tag}), candidates:cands, empty:t('noOthers', {plural:spPlural(species(p.speciesId))}), onPick(id){
      if(!id) return; const c = clone(animal(id)); const had = c[key]; c[key] = p.id; Store.put('animals', id, c);
      toast(t('linkedOffspring', {x:c.tag, f:p.sex === 'F', r:!!had}));
    }});
  },
  pickDam: () => formPickParent('F'),
  pickSire: () => formPickParent('M'),
  clearDam: () => { const r = cur(); r.draft.damId = ''; r.dirty = true; render(); },
  clearSire: () => { const r = cur(); r.draft.sireId = ''; r.dirty = true; render(); },
  birthToday: () => { const r = cur(); r.draft.birthDate = todayISO(); r.dirty = true; const el = $('#f-birth'); el.value = r.draft.birthDate; el.dispatchEvent(new Event('change', {bubbles:true})); },
  dropPhoto: () => { const r = cur(); Object.assign(r.draft, {thumb:'', photoFull:null, photoChanged:true}); r.dirty = true; render(); },
  deleteAnimal: ds => {
    const a = animal(ds.id); if(!a) return;
    const kids = children(a.id);
    confirmSheet({title:t('delAnimalQ', {x:a.tag}), body:t('delAnimalBody', {x:label(a), k:kids.length}), yes:t('deleteForGood'), danger:true, onYes(){
      kids.forEach(k => { const x = clone(k); if(x.damId === a.id) x.damId = ''; if(x.sireId === a.id) x.sireId = ''; Store.put('animals', k.id, x); });
      Store.del('animals', a.id); if(a.hasPhoto) Store.removePhoto(a.id);
      cur().dirty = false; S.stack = [{s:'animals'}]; render(); window.scrollTo(0,0); toast(t('xDeleted', {x:a.tag}));
    }});
  },
  deleteRule: ds => {
    const x = Store.data.vaccines.get(ds.id); if(!x) return;
    confirmSheet({title:t('delRuleQ'), body:t('delRuleBody', {s:ruleLabel(x)}), yes:t('delRuleBtn'), danger:true, onYes(){ Store.del('vaccines', x.id); cur().dirty = false; back(true); toast(t('ruleDeleted')); }});
  },
  deleteType: ds => {
    const x = species(ds.id); if(!x) return;
    const rules = [...Store.data.vaccines.values()].filter(r => r.speciesId === x.id);
    confirmSheet({title:t('delTypeQ', {s:spLabel(x)}), body: rules.length ? t('delTypeRules', {n:rules.length}) : t('delTypeNone'), yes:t('delTypeBtn'), danger:true, onYes(){ rules.forEach(r => Store.del('vaccines', r.id)); Store.del('species', x.id); cur().dirty = false; back(true); toast(t('typeDeleted')); }});
  },
  deleteStatus: ds => {
    const x = statusDef(ds.id); if(!x) return; const n = Number(ds.n) || 0;
    confirmSheet({title:t('delStatusQ', {s:stLabel(x)}), body: n ? t('delStatusSome', {n}) : t('delStatusNone'), yes:t('delStatusBtn'), danger:true, onYes(){
      A().filter(a => (a.statuses || []).some(s => s.statusId === x.id)).forEach(a => dropStatus(a.id, x.id, todayISO(), t('statusDeletedNote')));
      Store.del('statuses', x.id); cur().dirty = false; back(true); toast(t('statusDeleted'));
    }});
  },
  clearSamples: () => {
    const ex = A().filter(a => a.sample), ids = new Set(ex.map(a => a.id));
    confirmSheet({title:t('removeSamplesQ'), body:t('removeSamplesBody', {n:ex.length}), yes:t('removeExamples'), danger:true, onYes(){
      A().filter(a => !a.sample && (ids.has(a.damId) || ids.has(a.sireId))).forEach(a => { const x = clone(a); if(ids.has(x.damId)) x.damId = ''; if(ids.has(x.sireId)) x.sireId = ''; Store.put('animals', a.id, x); });
      ex.forEach(a => { Store.del('animals', a.id); if(a.hasPhoto) Store.removePhoto(a.id); });
      toast(t('samplesRemoved'));
    }});
  },
  size: ds => { const v = ds.v === 'm' ? '' : ds.v; if(v) document.documentElement.dataset.size = v; else delete document.documentElement.dataset.size; try{ localStorage.setItem(LS_KEY + ':size', ds.v); }catch(e){} render(); },
  exportCsv: () => exportFile(),
  saveBackup: () => saveBackup(),
  loadSamples: () => loadSamples(),
  installApp: async () => { if(!installPrompt) return; installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt = null; render(); },
  dismissInstall: () => { try{ localStorage.setItem(LS_KEY + ':installDismissed', '1'); }catch(e){} render(); },
  applyUpdate: () => { if(S.swReg && S.swReg.waiting) S.swReg.waiting.postMessage('skipWaiting'); else location.reload(); }
};
function linkParent(childId, sex){
  const c = animal(childId); if(!c) return;
  const isM = sex === 'F', key = isM ? 'damId' : 'sireId';
  const sp = species(c.speciesId);
  pickAnimal({title:t('chooseParentOf', {m:isM, x:c.tag}), candidates:parentCandidates(c.id, c.speciesId, sex), selected:c[key], empty:isM ? t('noFemales', {plural:spPlural(sp)}) : t('noMales', {plural:spPlural(sp)}), onPick(id){
    if(!id) return; const x = clone(animal(childId)); x[key] = id; Store.put('animals', childId, x); toast(t('linkedAs', {x:animal(id).tag, m:isM}));
  }});
}
function formPickParent(sex){
  const r = cur(), d = r.draft;
  if(!d.speciesId){ toast(t('chooseTypeFirst')); $('#f-species')?.scrollIntoView({block:'center'}); return; }
  const isM = sex === 'F', key = isM ? 'damId' : 'sireId';
  const sp = species(d.speciesId);
  pickAnimal({title:isM ? t('chooseMother') : t('chooseFather'), candidates:parentCandidates(r.id, d.speciesId, sex), selected:d[key], noneLabel:d[key] ? (isM ? t('noMotherRec') : t('noFatherRec')) : '', empty:isM ? t('noFemales', {plural:spPlural(sp)}) : t('noMales', {plural:spPlural(sp)}), onPick(id){ d[key] = id; r.dirty = true; render(); }});
}
/* ---------------- device helpers: install, files, backup ---------------- */
const UA = navigator.userAgent || '';
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const isPhone = isIOS || isAndroid;
function isStandalone(){ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){ return false; } }
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if(Store.ready) render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; if(Store.ready) render(); });
function installSteps(inSetup){
  const steps = TX[isIOS ? 'iosSteps' : isAndroid ? 'androidSteps' : 'pcSteps'][AR() ? 1 : 0];
  return `${inSetup ? `<p style="margin:0">${t('installWhy')}</p>` : ''}
    ${installPrompt ? `<div><button class="btn btn-primary" data-act="installApp">${ico('download')}${t('installBtn')}</button></div>` : `<ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`}`;
}
function installCard(){
  let dismissed = false;
  try{ dismissed = localStorage.getItem(LS_KEY + ':installDismissed') === '1'; }catch(e){}
  if(isStandalone() || dismissed || location.protocol === 'file:') return '';
  return `<div class="notice"><h3>${esc(t('installTitle', {pc:!isPhone}))}</h3><p>${t('installWhy')}</p>${installSteps(false)}<div><button class="btn btn-sm" data-act="dismissInstall">${t('notNow')}</button></div></div>`;
}
function backupReminder(){
  const own = A().filter(a => !a.sample).length;
  if(!own || Store.mode !== 'device') return '';
  const lb = Store.meta.lastBackup;
  if(lb && diffDays(lb, todayISO()) < 30) return '';
  const when = lb ? t('lastBackup', {d:fmtDate(lb)}) : t('lastBackupNever');
  return `<div class="notice warn"><h3>${t('remindTitle')}</h3><p>${esc(t('remindBody', {when}))}</p><div><button class="btn btn-sm btn-primary" data-act="saveBackup">${ico('download')}${t('saveBackupNow')}</button></div></div>`;
}
async function saveFile(filename, data, mime){
  const blob = new Blob([data], {type:mime});
  let coarse = false; try{ coarse = matchMedia('(pointer:coarse)').matches; }catch(e){}
  if(coarse && navigator.canShare && typeof File === 'function'){
    try{
      const file = new File([blob], filename, {type:mime});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return 'shared'; }
    }catch(e){ if(e && e.name === 'AbortError') return 'cancelled'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return 'downloaded';
}
async function saveBackup(){
  const data = await Store.exportAll();
  const res = await saveFile(`herd-book-backup-${todayISO()}.json`, JSON.stringify(data), 'application/json');
  if(res === 'cancelled') return;
  await Store.setMeta('lastBackup', todayISO());
  toast(t('backupSaved')); render();
}
function restoreFrom(file){
  const rd = new FileReader();
  rd.onload = () => {
    let b = null;
    try{ b = JSON.parse(String(rd.result)); }catch(e){ b = null; }
    if(!b || b.app !== 'Herd Book' || !b.animals){ toast(t('badBackup'), 5000); return; }
    const count = Array.isArray(b.animals) ? b.animals.length : Object.keys(b.animals).length;
    confirmSheet({title:t('restoreQ'), body:t('restoreBody', {d:fmtDate(String(b.exported || '').slice(0,10)), n:count, m:A().length}), yes:t('restoreYes'), danger:true, async onYes(){
      const ok = await Store.importAll(b);
      if(ok){ S.stack = [{s:'home'}]; render(); window.scrollTo(0,0); toast(t('restored')); }
    }});
  };
  rd.onerror = () => toast(t('badBackup'), 5000);
  rd.readAsText(file);
}
function loadSamples(){
  const shift = diffDays(SAMPLE_DAY, todayISO());
  const ops = [];
  Object.entries(SAMPLE_ANIMALS).forEach(([id, d]) => { if(!Store.data.animals.has(id)) ops.push([id, shiftDates(d, shift)]); });
  ops.forEach(([id, d]) => Store.put('animals', id, d));
  toast(t('samplesLoaded'));
  S.stack = [{s:'home'}]; render(); window.scrollTo(0,0);
}
async function exportFile(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const head = TX.csvHead[AR() ? 1 : 0];
  const rows = A().sort(byTag).map(a => {
    const v = [...(a.vaccinations || [])].sort((x,y) => (y.date || '').localeCompare(x.date || ''))[0];
    const nx = isActive(a) ? rulesFor(a).map(r => ({r, n:nextDue(a, r)})).filter(x => !x.n.done).sort((x,y) => x.n.due.localeCompare(y.n.due))[0] : null;
    const kids = children(a.id);
    return [a.tag, aName(a), spName(a), sexWord(a.sex), tx(a.breed), a.birthDate, ageText(a.birthDate), animal(a.damId)?.tag || '', animal(a.sireId)?.tag || '', (a.statuses || []).map(s => stLabel(statusDef(s.statusId))).join('; '), isActive(a) ? t('yes') : t('no'), kids.length, kids.map(k => k.tag).join(' '), v ? `${vxName(v)} (${v.date})` : '', nx ? `${ruleLabel(nx.r)} (${nx.n.due})` : '', tx(a.notes)].map(q).join(',');
  });
  const res = await saveFile(`herd-list-${todayISO()}.csv`, '﻿' + [head.join(','), ...rows].join('\r\n'), 'text/csv');
  if(res !== 'cancelled') toast(t('fileSaved'));
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ e.preventDefault(); tabGo(tab.dataset.tab); return; }
  const el = e.target.closest('[data-go],[data-act]');
  if(!el) return;
  if(el.closest('#sheet-root') && !el.dataset.go) return;
  if(el.dataset.go){ e.preventDefault(); if(el.closest('#sheet-root')) closeSheet(); const p = el.dataset.go; guardLeave(() => go(p)); return; }
  const fn = ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#viewer-root').innerHTML){ $('#viewer-root').innerHTML = ''; return; }
  if(S.sheetOpen) closeSheet();
});

/* ---------------- boot ---------------- */
try{ const sz = localStorage.getItem(LS_KEY + ':size'); if(sz === 'l' || sz === 'xl') document.documentElement.dataset.size = sz; }catch(e){}
let startLang = 'en';
try{ const l = localStorage.getItem(LS_KEY + ':lang'); if(l === 'ar' || l === 'en') startLang = l; else if(/^ar\b/i.test(navigator.language || '')) startLang = 'ar'; }catch(e){ if(/^ar\b/i.test(navigator.language || '')) startLang = 'ar'; }
setLang(startLang);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    S.swReg = reg;
    const offer = () => { if(reg.waiting && navigator.serviceWorker.controller) showBanner('updateReady', 'info', 'applyUpdate', 'updateNow'); };
    offer();
    reg.addEventListener('updatefound', () => { const w = reg.installing; if(w) w.addEventListener('statechange', () => { if(w.state === 'installed') offer(); }); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(!hadController || reloading) return; reloading = true; location.reload(); });
}
try{ const h = (location.hash || '').slice(1); if(['animals','vaccines','setup'].includes(h)) S.stack = [{s:h}]; }catch(e){}
render();
Store.init();
})();
</script>
