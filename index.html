<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herd Book</title>
<meta name="description" content="Livestock records on your own device: ID tags, photos, family trees, statuses and vaccine reminders. Works without internet.">
<meta name="theme-color" content="#1D5C45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Herd Book">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --surface-2:#F5F7F2; --ink:#17201B; --muted:#56615A;
  --line:#D3DACF; --line-strong:#A9B4A5;
  --primary:#1D5C45; --primary-ink:#FFFFFF; --primary-soft:#DDEDE4;
  --tag:#F4C21B; --tag-ink:#1A1A12; --tag-edge:#C99A00;
  --red:#B3261E; --red-soft:#FBE7E5;
  --amber:#945000; --amber-soft:#FCEFD9;
  --purple:#6B3FA0; --purple-soft:#EFE6F8;
  --blue:#1C5DA8; --blue-soft:#E3EDF9;
  --green:#1E7A4C; --green-soft:#E0F1E7;
  --grey:#5F6661; --grey-soft:#E7EAE5;
  --scrim:rgba(12,20,15,.5);
  --shadow:0 1px 2px rgba(20,32,26,.08),0 3px 10px rgba(20,32,26,.06);
  --num:"Avenir Next Condensed","Bahnschrift","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --display:"Avenir Next Condensed","Bahnschrift","Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101512; --surface:#19201C; --surface-2:#1F2722; --ink:#EDF1EC; --muted:#A5B0A8;
    --line:#2E3832; --line-strong:#4A574F;
    --primary:#63C595; --primary-ink:#0B1A12; --primary-soft:#1C3328;
    --tag:#F2C230; --tag-ink:#16140A; --tag-edge:#B8900F;
    --red:#FF8F85; --red-soft:#3B1D1A; --amber:#F2B25E; --amber-soft:#3A2A12;
    --purple:#C9A8F4; --purple-soft:#2D2240; --blue:#8FBAF3; --blue-soft:#172A42;
    --green:#80D4A7; --green-soft:#16301F; --grey:#AFB7B1; --grey-soft:#2A302C;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#19201C; --surface-2:#1F2722; --ink:#EDF1EC; --muted:#A5B0A8;
  --line:#2E3832; --line-strong:#4A574F;
  --primary:#63C595; --primary-ink:#0B1A12; --primary-soft:#1C3328;
  --tag:#F2C230; --tag-ink:#16140A; --tag-edge:#B8900F;
  --red:#FF8F85; --red-soft:#3B1D1A; --amber:#F2B25E; --amber-soft:#3A2A12;
  --purple:#C9A8F4; --purple-soft:#2D2240; --blue:#8FBAF3; --blue-soft:#172A42;
  --green:#80D4A7; --green-soft:#16301F; --grey:#AFB7B1; --grey-soft:#2A302C;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4);
}
html[lang="ar"]{
  --display:system-ui,-apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --body:system-ui,-apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
}
.tag,.tile-num,.input-tag{font-stretch:condensed}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:20px}
html[data-size="xl"]{font-size:23px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45}
html[lang="ar"] body{line-height:1.6}
html[lang="ar"] body *:not(.tag):not(.tile-num):not(.input-tag){letter-spacing:0!important}
html[dir="rtl"] .flip{transform:scaleX(-1)}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:1.25rem;height:1.25rem;flex:none}
.vrow > svg{width:1.4rem;height:1.4rem;color:var(--muted)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
h1,h2,h3{text-wrap:balance}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:44rem;margin:0 auto;padding-inline:16px;min-height:3.6rem;display:flex;align-items:center;gap:.4rem}
.back{display:inline-flex;align-items:center;gap:.1rem;min-height:2.9rem;padding-block:0;padding-inline:.2rem .75rem;margin-inline-start:-.3rem;border-radius:.8rem;font-weight:700;color:var(--primary);background:transparent;border:0}
.back svg{width:1.5rem;height:1.5rem}
.top-title{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
html[lang="ar"] .top-title{font-size:1.35rem}
.brand{display:flex;align-items:center;gap:.55rem}
.brand-mark{width:1.15rem;height:1.5rem;background:var(--tag);border:1px solid var(--tag-edge);border-radius:.35rem .35rem .55rem .55rem;position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;left:50%;top:.2rem;width:.34rem;height:.34rem;margin-left:-.17rem;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--tag-edge)}
.top-action{flex:none}
.lang-btn{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}

.wrap{max-width:44rem;margin:0 auto;padding-inline:16px;padding-block:1rem calc(7rem + env(safe-area-inset-bottom,0px))}
.banner{max-width:44rem;margin:.75rem auto 0;padding-inline:16px}
.banner-in{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:.9rem;background:var(--amber-soft);color:var(--ink);border:1px solid var(--line)}
.banner-in.error{background:var(--red-soft)}
.banner-in.info{background:var(--blue-soft);align-items:center;flex-wrap:wrap}
.banner-in .btn{margin-inline-start:auto;flex:none}
.notice h3{margin:0;font-size:1.05rem}
.notice ol{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.3rem}
.notice.warn{background:var(--amber-soft);border-style:solid;border-color:color-mix(in srgb,var(--amber) 35%,transparent)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:44rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:4.3rem;background:none;border:0;color:var(--muted);font-size:.76rem;font-weight:700;padding:.35rem .1rem;line-height:1.15;text-align:center}
.tab-ico{display:grid;place-items:center;width:3.3rem;height:2.05rem;border-radius:1.1rem}
.tab svg{width:1.55rem;height:1.55rem}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tab-ico{background:var(--primary-soft);color:var(--primary)}
.tab-add .tab-ico{background:var(--primary);color:var(--primary-ink)}
.tab-add[aria-current="page"] .tab-ico{background:var(--primary);color:var(--primary-ink)}

/* ear tag */
.tag{display:inline-flex;align-items:center;gap:.32em;background:var(--tag);color:var(--tag-ink);font-family:var(--num);font-weight:700;font-size:1.2rem;letter-spacing:.02em;line-height:1;padding:.26em .62em .26em .42em;border-radius:.4em .95em .95em .4em;border:1px solid var(--tag-edge);font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;direction:ltr;unicode-bidi:isolate}
.tag::before{content:"";width:.4em;height:.4em;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--tag-edge);flex:none}
.tag-lg{font-size:2.3rem;padding:.2em .6em .2em .4em}
.tag-sm{font-size:1.02rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.1rem;padding:.55rem 1.05rem;border-radius:.85rem;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;text-align:center;text-decoration:none;line-height:1.2}
.btn svg{width:1.3rem;height:1.3rem;flex:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-danger{color:var(--red);border-color:var(--red);background:var(--surface)}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-block{width:100%}
.btn-lg{min-height:3.6rem;font-size:1.08rem}
.btn-sm{min-height:2.75rem;padding:.35rem .8rem;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem}
.btn-row .btn{flex:1 1 12rem}
.link{background:none;border:0;padding:0 .15rem;min-height:2.75rem;color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{--c:var(--grey);--c-soft:var(--grey-soft);display:inline-flex;align-items:center;gap:.38rem;padding-block:.18rem;padding-inline:.5rem .62rem;border-radius:999px;font-size:.86rem;font-weight:700;background:var(--c-soft);color:var(--c);border:1px solid transparent;border-color:color-mix(in srgb,var(--c) 28%,transparent);line-height:1.3}
.chip i{width:.58rem;height:.58rem;border-radius:50%;background:var(--c);flex:none}
.c-red{--c:var(--red);--c-soft:var(--red-soft)}
.c-amber{--c:var(--amber);--c-soft:var(--amber-soft)}
.c-purple{--c:var(--purple);--c-soft:var(--purple-soft)}
.c-blue{--c:var(--blue);--c-soft:var(--blue-soft)}
.c-green{--c:var(--green);--c-soft:var(--green-soft)}
.c-grey{--c:var(--grey);--c-soft:var(--grey-soft)}
.dot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}

/* home */
.today{color:var(--muted);font-weight:700;margin:0 0 .6rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:1rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.85rem .95rem;text-align:start;display:flex;flex-direction:column;gap:.15rem;min-height:6.6rem}
.tile-num{font-family:var(--num);font-weight:700;font-size:2.7rem;line-height:.95;font-variant-numeric:tabular-nums}
.tile-label{font-weight:700}
.tile-sub{color:var(--muted);font-size:.84rem;line-height:1.3}
.tile.is-alert .tile-num,.tile.is-alert .tile-sub.strong{color:var(--red)}
.tile.is-warn .tile-num{color:var(--amber)}
.tile.is-alert{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.notice{display:flex;flex-direction:column;gap:.6rem;padding:.95rem 1rem;border-radius:1rem;background:var(--surface-2);border:1px dashed var(--line-strong);margin-top:1rem}
.notice p{margin:0}

.sec{display:flex;flex-direction:column;gap:.7rem;margin-top:1.8rem}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:.01em;line-height:1.2}
html[lang="ar"] .sec-h h2{font-size:1.3rem}
.sec-h .count{color:var(--muted);font-weight:700;font-size:.95rem}
.empty-note{color:var(--muted);margin:0;padding:.9rem 1rem;border:1px dashed var(--line-strong);border-radius:1rem}

/* filters */
.fchips{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:thin}
.fchip{flex:none;display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.3rem .95rem;border-radius:999px;border:2px solid var(--line-strong);background:var(--surface);font-weight:700}
.fchip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:.85rem;top:50%;width:1.35rem;height:1.35rem;margin-top:-.675rem;color:var(--muted);pointer-events:none}
.searchbox .input{padding-inline-start:2.7rem}
.filter-row{display:grid;grid-template-columns:1fr;gap:.7rem}

/* animal cards */
.alist{display:flex;flex-direction:column;gap:.6rem}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.acard.past{background:var(--surface-2)}
.acard-main{display:grid;grid-template-columns:4.3rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;padding:.7rem;background:none;border:0;text-align:start}
.acard-main > svg{width:1.4rem;height:1.4rem;color:var(--muted)}
.thumb{width:4.3rem;height:4.3rem;border-radius:.8rem;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden;border:1px solid var(--line);flex:none}
.thumb svg{width:45%;height:45%}
.thumb.sm{width:3rem;height:3rem;border-radius:.6rem}
.acard-body{min-width:0;display:flex;flex-direction:column;gap:.28rem}
.acard-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;min-width:0}
.aname{font-weight:700;font-size:1.08rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.9rem;line-height:1.35}
.acard-note{font-size:.9rem;color:var(--ink);margin:0}
.acard-kids{border-top:1px solid var(--line);padding:.5rem .7rem .6rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;background:var(--surface-2)}
.acard-kids .lbl-sm{margin-inline-end:.2rem}
.kid{background:none;border:0;padding:.25rem .1rem;min-height:2.75rem;display:inline-flex;align-items:center}
.kid .tag{font-size:1rem}
.lbl-sm{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.past-l{display:inline-block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-strong);border-radius:.4rem;padding:0 .35rem}

/* vaccine rows */
.vlist{display:flex;flex-direction:column;gap:.55rem}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding-block:.45rem;padding-inline:.85rem .6rem;text-align:start}
.vrow-main{background:none;border:0;text-align:start;padding:.35rem 0;display:flex;flex-direction:column;gap:.22rem;min-width:0}
.vrow-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.vname{font-weight:700}
.due{font-weight:700;font-size:.92rem}
.due.late{color:var(--red)}
.due.soon{color:var(--amber)}
.due.ok{color:var(--green)}
.group-h{font-weight:700;margin:.6rem 0 0;display:flex;align-items:center;gap:.5rem}

/* profile */
.phead{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:1rem;align-items:start}
.photo-lg{width:8rem;height:8rem;border-radius:1rem;border:1px solid var(--line);background:var(--surface-2);padding:0;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.photo-lg img{width:100%;height:100%;object-fit:cover;display:block}
.photo-lg .ph{display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.85rem;font-weight:700}
.photo-lg svg{width:2rem;height:2rem}
.phead-b{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.pname{font-size:1.4rem;margin:0;line-height:1.25;overflow-wrap:anywhere}
.pmeta{color:var(--muted);margin:0}
@media (max-width:360px){.phead{grid-template-columns:1fr}.photo-lg{width:100%;height:12rem}}

.subtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.25rem;background:var(--surface-2);border:1px solid var(--line);border-radius:1rem;padding:.25rem;margin-top:1.1rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.65rem);z-index:10}
.subtab{min-height:3rem;min-width:0;border:0;border-radius:.78rem;background:transparent;font-weight:700;font-size:clamp(.75rem,3.6vw,.9rem);color:var(--muted);padding:.2rem .15rem;line-height:1.15}
.subtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:2px solid var(--primary);outline-offset:-2px}
.panel{display:flex;flex-direction:column;gap:1rem;margin-top:1.1rem}
.panel h3{font-family:var(--display);font-size:1.3rem;margin:.6rem 0 0;font-weight:700;letter-spacing:.01em}
html[lang="ar"] .panel h3:not(.tier-label){font-size:1.15rem}

.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.qa .btn{flex-direction:column;min-height:5rem;gap:.3rem;padding:.6rem}
.qa .btn svg{width:1.6rem;height:1.6rem;color:var(--primary)}
.callout{padding:.9rem 1rem;border-radius:1rem;background:var(--c-soft);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;gap:.2rem}
.callout strong{color:var(--c)}
.callout p{margin:0}

.dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.dl-row{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border-top:1px solid var(--line)}
.dl-row:first-child{border-top:0}
.dl dt,.dl dd{margin:0;padding:.7rem .9rem;overflow-wrap:anywhere}
.dl dt{color:var(--muted);font-weight:700;font-size:.92rem;overflow-wrap:break-word;hyphens:auto}
.btn-inline{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:.45rem;min-height:2.4rem;text-align:start}

/* family tree */
.tree{display:flex;flex-direction:column}
.tier{display:flex;flex-direction:column;gap:.5rem}
.panel .tier-label,.tier-label{font-family:var(--body);font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
.kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:.55rem}
.node{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.55rem;display:flex;gap:.6rem;align-items:center;text-align:start;min-height:4.2rem;width:100%;min-width:0}
.node-b{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;min-width:0}
.node-role{font-size:.8rem;font-weight:700;color:var(--muted)}
.node-name{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.node.empty{border:2px dashed var(--line-strong);background:transparent;color:var(--muted);flex-direction:column;align-items:flex-start;justify-content:center;gap:.1rem}
.node-add{color:var(--primary);font-weight:700;font-size:.92rem}
.node.self{border:2px solid var(--primary);background:var(--primary-soft)}
.stem{width:2px;height:1.2rem;background:var(--line-strong);margin:.35rem auto}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.timeline li{display:grid;grid-template-columns:6.6rem minmax(0,1fr) auto;gap:.7rem;align-items:start;padding:.7rem .9rem;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.t-date{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;font-weight:700}
.t-body{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.t-note{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.icon-btn{background:none;border:0;min-width:2.75rem;min-height:2.75rem;display:grid;place-items:center;border-radius:.7rem;color:var(--muted)}
.icon-btn svg{width:1.3rem;height:1.3rem}

.stlist{display:flex;flex-direction:column;gap:.55rem}
.strow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding-block:.65rem;padding-inline:.9rem .7rem}
.strow-b{display:flex;flex-direction:column;gap:.25rem;min-width:0}

/* forms */
.form{display:flex;flex-direction:column;gap:1.25rem}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
.field{display:flex;flex-direction:column;gap:.4rem}
.lbl{font-weight:700;font-size:1rem;padding:0}
.req{font-weight:400;color:var(--muted);font-size:.85rem;margin-inline-start:.3rem}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.input{min-height:3.3rem;padding:.6rem .85rem;border:2px solid var(--line-strong);border-radius:.8rem;background:var(--surface);color:var(--ink);width:100%;font-size:1rem}
.input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.input-tag{font-family:var(--num);font-weight:700;font-size:1.5rem;letter-spacing:.03em;unicode-bidi:plaintext}
textarea.input{min-height:5.5rem;resize:vertical;line-height:1.45}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.3rem) 55%,calc(100% - .95rem) 55%;background-size:.36rem .36rem;background-repeat:no-repeat;padding-inline-end:2.4rem}
html[dir="rtl"] select.input{background-position:.95rem 55%,1.3rem 55%}
.row{display:flex;gap:.5rem;align-items:stretch}
.row > .input{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opts-col{flex-direction:column}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:.5rem;min-height:3.2rem;padding:.5rem 1rem;border:2px solid var(--line-strong);border-radius:.8rem;background:var(--surface);font-weight:700}
.opt input:checked + span{border-color:var(--primary);background:var(--primary-soft)}
.opt input:checked + span::before{content:"✓";color:var(--primary);font-weight:700}
.opt input:focus-visible + span{outline:3px solid var(--blue);outline-offset:2px}
.opt input:disabled + span{opacity:.5}
.check{display:flex;gap:.75rem;align-items:flex-start;padding:.8rem .9rem;border:2px solid var(--line-strong);border-radius:.8rem;background:var(--surface);cursor:pointer}
.check input{width:1.5rem;height:1.5rem;margin:.1rem 0 0;accent-color:var(--primary);flex:none}
.check b{display:block}
.err{padding:.85rem 1rem;border-radius:.9rem;background:var(--red-soft);color:var(--red);font-weight:700;border:1px solid color-mix(in srgb,var(--red) 35%,transparent)}
.err ul{margin:.3rem 0 0;padding-inline-start:1.2rem}
.input.bad{border-color:var(--red)}
.photo-edit{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:1rem;align-items:center}
.photo-prev{width:7rem;height:7rem;border-radius:1rem;overflow:hidden;background:var(--surface-2);border:2px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted)}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev svg{width:2rem;height:2rem}
.photo-btns{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.pbtn{display:flex;align-items:center;gap:.7rem;width:100%;min-height:3.6rem;padding:.5rem .8rem;border:2px solid var(--line-strong);border-radius:.8rem;background:var(--surface);text-align:start}
.pbtn .choose{color:var(--primary);font-weight:700}
.parent-pick{display:flex;flex-direction:column;gap:.35rem}
.parent-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:.5rem}
.swatches .opt span{padding:.5rem .9rem}
.unit-row{display:grid;grid-template-columns:6rem minmax(0,1fr);gap:.5rem}
.preview-line{padding:.8rem 1rem;border-radius:.9rem;background:var(--surface-2);border:1px solid var(--line);margin:0}

/* setup */
.setlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center;width:100%;padding:.8rem .9rem;background:none;border:0;border-top:1px solid var(--line);text-align:start;min-height:3.6rem}
.setrow:first-child{border-top:0}
.setrow svg{width:1.3rem;height:1.3rem;color:var(--muted)}
.setrow-b{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.sizes .btn,.langs .btn{flex-direction:column;gap:0;min-height:4rem;padding:.4rem}
.sizes .btn[aria-pressed="true"],.langs .btn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.langs .btn{font-size:1.1rem}
.rule-card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.35rem;text-align:start;width:100%}
.rule-card .rule-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.rule-card p{margin:0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:44rem;max-height:90vh;max-height:90dvh;border-radius:1.25rem 1.25rem 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 16px .7rem;border-bottom:1px solid var(--line)}
.sheet-h h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.2;outline:none}
html[lang="ar"] .sheet-h h2{font-size:1.25rem}
.sheet-b{overflow:auto;padding:1rem 16px 1.3rem;display:flex;flex-direction:column;gap:1rem;overscroll-behavior:contain}
.plist{display:flex;flex-direction:column;gap:.5rem}
.prow{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:.7rem;align-items:center;width:100%;padding:.5rem .6rem;border:2px solid var(--line);border-radius:.9rem;background:var(--surface);text-align:start;min-height:4rem}
.prow.on{border-color:var(--primary);background:var(--primary-soft)}

.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(.6rem + env(safe-area-inset-top,0px)) 16px .6rem;color:#fff;gap:1rem}
.viewer-bar .btn{background:#fff;color:#111;border-color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.3rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:.9rem;font-weight:700;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
.loading{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:4rem 1rem;color:var(--muted);text-align:center}
.loading .tag{font-size:1.6rem}
.fine{color:var(--muted);font-size:.86rem;margin:0}
.mt{margin-top:1rem}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>

  return parts.join(AR() ? '، ' : ', ') + '.' + who;
}
const UNCOUNT = new Set(['sheep','cattle','deer','fish','bison','swine','poultry']);
function pluralWord(w, n){
  if(!w) return '';
  if(n === 1 || UNCOUNT.has(w.toLowerCase())) return w;
  if(/[^aeiou]y$/i.test(w)) return w.slice(0,-1)+'ies';
  if(/(al|ar|el)f$/i.test(w)) return w.slice(0,-1)+'ves';
  if(/(s|x|ch|sh)$/i.test(w)) return w+'es';
  return w+'s';
}
const sexWord = s => s === 'F' ? t('female') : s === 'M' ? t('male') : '';
const safeImg = s => (typeof s === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(s)) ? s : '';

/* ---------------- storage (on this device, IndexedDB) ---------------- */
const DB_NAME = 'herdbook';
const STORES = ['animals','species','statuses','vaccines','photos','meta'];
let bc = null; try{ bc = new BroadcastChannel('herdbook'); }catch(e){ bc = null; }
function idbOpen(){
  return new Promise((res, rej) => {
    if(!('indexedDB' in window)) return rej(new Error('no indexedDB'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if(!db.objectStoreNames.contains(s)) db.createObjectStore(s); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function idbAll(db, store){
  return new Promise((res, rej) => {
    const m = new Map();
    const req = db.transaction(store, 'readonly').objectStore(store).openCursor();
    req.onsuccess = () => { const c = req.result; if(c){ m.set(String(c.key), c.value); c.continue(); } else res(m); };
    req.onerror = () => rej(req.error);
  });
}
function idbGet(db, store, key){
  return new Promise((res, rej) => { const req = db.transaction(store, 'readonly').objectStore(store).get(key); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
}
const withId = (m) => { const out = new Map(); m.forEach((v, k) => out.set(k, Object.assign({}, v, {id:k}))); return out; };
function shiftDates(o, days){
  if(Array.isArray(o)) return o.map(x => shiftDates(x, days));
  if(o && typeof o === 'object'){
    const out = {};
    Object.entries(o).forEach(([k, v]) => {
      if((k === 'birthDate' || k === 'since' || k === 'date') && typeof v === 'string' && parseD(v)) out[k] = addDays(v, days);
      else if(k === 'createdAt' && typeof v === 'string') out[k] = addDays(v.slice(0,10), days) + v.slice(10);
      else out[k] = shiftDates(v, days);
    });
    return out;
  }
  return o;
}

const Store = {
  mode:'loading', idb:null, version:0, meta:{},
  data:{animals:new Map(), species:new Map(), statuses:new Map(), vaccines:new Map()},
  photoCache:new Map(),
  get ready(){ return this.mode !== 'loading'; },
  async init(){
    try{
      this.idb = await idbOpen();
      await this.loadAll();
      if(!this.meta.seeded) await this.seedDefaults();
      this.mode = 'device';
    }catch(e){
      this.mode = 'memory';
      COLS.forEach(c => { const m = new Map(); Object.entries(LOCAL_DEFAULTS[c] || {}).forEach(([id, d]) => m.set(id, Object.assign({}, d, {id}))); this.data[c] = m; });
      showBanner('eNoStorage', 'error');
    }
    if(bc) bc.onmessage = () => { this.loadAll().then(() => { this.photoCache.clear(); this.changed(); }).catch(() => {}); };
    this.changed();
  },
  async loadAll(){
    for(const c of COLS) this.data[c] = withId(await idbAll(this.idb, c));
    const meta = await idbAll(this.idb, 'meta');
    this.meta = {}; meta.forEach((v, k) => { this.meta[k] = v && v.value; });
  },
  seedDefaults(){
    const ops = {};
    ['species','statuses','vaccines'].forEach(c => { ops[c] = Object.entries(LOCAL_DEFAULTS[c]).filter(([id]) => !this.data[c].has(id)).map(([id, doc]) => ({id, doc})); ops[c].forEach(o => this.data[c].set(o.id, Object.assign({}, o.doc, {id:o.id}))); });
    ops.meta = [{id:'seeded', doc:{value:true}}]; this.meta.seeded = true;
    return this.writeMany(ops);
  },
  changed(){ this.version++; scheduleRender(); },
  writeMany(opsByStore){
    if(this.mode === 'memory' || !this.idb) return Promise.resolve(false);
    const names = Object.keys(opsByStore);
    return new Promise(res => {
      let tx;
      try{ tx = this.idb.transaction(names, 'readwrite'); }catch(e){ this.fail(e); return res(false); }
      names.forEach(n => { const st = tx.objectStore(n); opsByStore[n].forEach(o => o.doc ? st.put(o.doc, o.id) : st.delete(o.id)); });
      tx.oncomplete = () => { res(true); if(bc) try{ bc.postMessage(names); }catch(e){} this.askPersist(); };
      tx.onerror = tx.onabort = () => { this.fail(tx.error); res(false); };
    });
  },
  put(col, id, doc){
    const body = clone(doc); delete body.id; body.updatedAt = new Date().toISOString();
    this.data[col].set(id, Object.assign({}, body, {id}));
    this.changed();
    return this.writeMany({[col]:[{id, doc:body}]});
  },
  del(col, id){
    this.data[col].delete(id); this.changed();
    return this.writeMany({[col]:[{id, doc:null}]});
  },
  setMeta(k, v){ this.meta[k] = v; return this.writeMany({meta:[{id:k, doc:{value:v}}]}); },
  fail(err){
    const k = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || '')) ? 'eQuota' : 'eSave';
    showBanner(k, 'error'); toast(t(k), 5000);
  },
  askPersist(){
    if(this._asked) return; this._asked = true;
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if(!p) navigator.storage.persist(); }).catch(() => {}); }catch(e){}
  },
  async getPhoto(id){
    if(this.photoCache.has(id)) return this.photoCache.get(id);
    let src = null;
    if(this.idb){ try{ const v = await idbGet(this.idb, 'photos', id); src = v && v.src || null; }catch(e){ src = null; } }
    src = safeImg(src) || null;
    this.photoCache.set(id, src);
    return src;
  },
  setPhoto(id, src){ this.photoCache.set(id, src); return this.writeMany({photos:[{id, doc:{src}}]}); },
  removePhoto(id){ this.photoCache.set(id, null); return this.writeMany({photos:[{id, doc:null}]}); },
  async exportAll(){
    const out = {app:'Herd Book', format:1, exported:new Date().toISOString()};
    COLS.forEach(c => { out[c] = {}; this.data[c].forEach((d, id) => { const b = Object.assign({}, d); delete b.id; out[c][id] = b; }); });
    out.photos = {};
    if(this.idb){ const ph = await idbAll(this.idb, 'photos'); ph.forEach((v, k) => { if(v && safeImg(v.src)) out.photos[k] = v.src; }); }
    return out;
  },
  async importAll(b){
    const ops = {};
    for(const n of ['animals','species','statuses','vaccines','photos']){
      const existing = this.idb ? await idbAll(this.idb, n) : new Map();
      ops[n] = [...existing.keys()].map(id => ({id, doc:null}));
    }
    const norm = x => { if(Array.isArray(x)){ const o = {}; x.forEach(d => { if(d && d.id){ const c = Object.assign({}, d); delete c.id; o[d.id] = c; } }); return o; } return x && typeof x === 'object' ? x : {}; };
    COLS.forEach(c => { const src = norm(b[c]); const m = new Map(); Object.entries(src).forEach(([id, d]) => { if(d && typeof d === 'object'){ ops[c].push({id, doc:d}); m.set(id, Object.assign({}, d, {id})); } }); this.data[c] = m; });
    Object.entries(b.photos || {}).forEach(([id, src]) => { if(safeImg(src)) ops.photos.push({id, doc:{src}}); });
    ops.meta = [{id:'seeded', doc:{value:true}}];
    this.photoCache.clear();
    const ok = await this.writeMany(ops);
    this.changed();
    return ok;
  }
};

/* ---------------- data helpers ---------------- */
const A = () => [...Store.data.animals.values()];
const animal = id => id ? Store.data.animals.get(id) : undefined;
const species = id => id ? Store.data.species.get(id) : undefined;
const statusDef = id => id ? Store.data.statuses.get(id) : undefined;
const byOrder = (a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name));
const sortedSpecies = () => [...Store.data.species.values()].sort(byOrder);
const sortedStatuses = () => [...Store.data.statuses.values()].sort(byOrder);
const byTag = (a,b) => String(a.tag).localeCompare(String(b.tag), undefined, {numeric:true, sensitivity:'base'});
const byBirth = (a,b) => (a.birthDate || '9999').localeCompare(b.birthDate || '9999') || byTag(a,b);
const isActive = a => !(a.statuses || []).some(s => statusDef(s.statusId)?.leavesHerd);
const activeAnimals = () => A().filter(isActive);
const attention = a => (a.statuses || []).filter(s => statusDef(s.statusId)?.attention);
const roleStatus = role => [...Store.data.statuses.values()].find(s => s.role === role);
const roleOn = (a, role) => (a.statuses || []).find(s => statusDef(s.statusId)?.role === role);
const spLabel = sp => nm('species', sp);
const spName = a => spLabel(species(a.speciesId)) || t('animal');
const spPlural = sp => pluralWord(spLabel(sp) || t('animal'), 2);
const stLabel = d => d ? nm('statuses', d) : t('unknownStatus');
const ruleLabel = r => nm('vaccines', r);
function vxName(v){ const b = v.ruleId && BUILTIN_AR.vaccines[v.ruleId]; return AR() && b && v.name === b.en ? b.ar : v.name; }
const youngOf = sp => nm('species', sp, 'young') || (AR() ? 'مولود' : 'Offspring');
const aName = a => tx(a.name || '');
const label = a => a ? (a.name ? `${a.tag} (${aName(a)})` : a.tag) : '';

let IDX = {v:-1, kids:new Map()};
function index(){
  if(IDX.v === Store.version) return IDX;
  const kids = new Map();
  A().forEach(a => { [a.damId, a.sireId].forEach(p => { if(p){ if(!kids.has(p)) kids.set(p, []); kids.get(p).push(a); } }); });
  kids.forEach(list => list.sort(byBirth));
  IDX = {v:Store.version, kids};
  return IDX;
}
const children = id => index().kids.get(id) || [];
function siblings(a){
  const out = new Map();
  ['damId','sireId'].forEach(k => { if(!a[k]) return; children(a[k]).forEach(s => { if(s.id !== a.id) out.set(s.id, s); }); });
  return [...out.values()].sort(byBirth).map(s => {
    const full = a.damId && a.sireId && s.damId === a.damId && s.sireId === a.sireId;
    const sx = s.sex === 'F' || s.sex === 'M' ? s.sex : 'U';
    const rel = full ? t('sibFull', {s:sx}) : t('sibHalf', {s:sx, m:!!(a.damId && s.damId === a.damId)});
    return {s, rel};
  });
}
function descendants(id, seen = new Set()){ children(id).forEach(c => { if(!seen.has(c.id)){ seen.add(c.id); descendants(c.id, seen); } }); return seen; }
function ancestors(id, seen = new Set()){ const a = animal(id); if(!a) return seen; [a.damId, a.sireId].forEach(p => { if(p && !seen.has(p) && animal(p)){ seen.add(p); ancestors(p, seen); } }); return seen; }

function pregInfo(a){
  const s = roleOn(a, 'pregnant'); if(!s) return null;
  const g = Number(species(a.speciesId)?.gestationDays) || 0;
  return {since:s.since, expected: g && s.since ? addDays(s.since, g) : '', days:g};
}
function rulesFor(a){ return [...Store.data.vaccines.values()].filter(r => r.speciesId === a.speciesId && (!r.sex || r.sex === 'all' || r.sex === a.sex)).sort((x,y) => ruleLabel(x).localeCompare(ruleLabel(y))); }
function nextDue(a, r){
  const objs = (a.vaccinations || []).filter(v => v.ruleId === r.id && v.date).sort((x,y) => x.date.localeCompare(y.date));
  if(!objs.length){
    const due = a.birthDate ? addPeriod(a.birthDate, r.first) : (a.createdAt ? a.createdAt.slice(0,10) : todayISO());
    return {due, dose:1, never:true};
  }
  const last = objs[objs.length-1].date;
  if(objs.length === 1 && r.booster && r.booster.n && objs[0].course !== 'repeat') return {due:addPeriod(last, r.booster), dose:2, last};
  if(r.repeat && r.repeat.n) return {due:addPeriod(last, r.repeat), dose:objs.length+1, last, repeat:true};
  return {done:true, last};
}
function doseLabel(r, n){ if(n.dose === 1) return t('dose1'); if(!n.repeat) return t('dose2'); return t('doseR'); }
function allDue(){
  const td = todayISO(), out = [];
  activeAnimals().forEach(a => rulesFor(a).forEach(r => { const n = nextDue(a, r); if(n && !n.done && n.due) out.push({a, r, n, days:diffDays(td, n.due)}); }));
  return out.sort((x,y) => x.days - y.days || byTag(x.a, y.a));
}

const S = { stack:[{s:'home'}], sheetOpen:false, banner:null };
const cur = () => S.stack[S.stack.length-1];
const FORM_SCREENS = new Set(['form','rule','type','status']);
let renderQueued = false;
function scheduleRender(){
  if(renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if(Store.ready && FORM_SCREENS.has(cur().s) && cur()._shown){ renderTabs(); return; } render(); });
}
function parsePath(p){
  const [a, b, c] = p.split('/');
  if(a === 'animal') return {s:'animal', id:b, tab:c || 'overview'};
  if(a === 'edit') return {s:'form', id:b};
  if(a === 'vaccines') return {s:'vaccines', tab:b || 'due'};
  if(a === 'rule' || a === 'type' || a === 'status') return {s:a, id:b === 'new' ? null : b, preset:c ? {speciesId:c} : null};
  return {s:a};
}
function go(route, how = {}){
  if(typeof route === 'string') route = parsePath(route);
  const top = cur();
  if(!how.replace) top._scroll = window.scrollY;
  if(how.root) S.stack = [route];
  else if(how.replace) S.stack[S.stack.length-1] = route;
  else S.stack.push(route);
  render(); window.scrollTo(0, 0);
}
function guardLeave(then){
  const r = cur();
  if(FORM_SCREENS.has(r.s) && r.dirty){
    confirmSheet({title:t('leaveQ'), body:t('leaveBody'), yes:t('leaveYes'), no:t('keepEditing'), danger:true, onYes:then});
  } else then();
}
function back(force){
  const run = () => {
    if(S.stack.length > 1){ S.stack.pop(); render(); const y = cur()._scroll; if(y != null){ window.scrollTo(0, y); cur()._scroll = null; } }
  };
  force ? run() : guardLeave(run);
}
function tabGo(tab){

    if(tab === 'add'){ const root = S.stack[0]; S.stack = [root.s === 'form' ? {s:'animals'} : root, {s:'form'}]; render(); window.scrollTo(0,0); return; }
    go({s:tab}, {root:true});

}

}

    <div class="tiles">
      <button class="tile" data-act="filterAnimals" data-f="all"><span class="tile-num">${act.length}</span><span class="tile-label">${t('inHerd')}</span><span class="tile-sub">${spCounts.map(x => esc(t('spCount', {n:x.n, plural:pluralWord(spLabel(x.sp), x.n), name:spLabel(x.sp)}))).join(' · ') || t('noAnimalsYet')}</span></button>
      <button class="tile ${att.length ? 'is-alert' : ''}" data-act="filterAnimals" data-f="attention"><span class="tile-num">${att.length}</span><span class="tile-label">${t('needAttention')}</span><span class="tile-sub">${att.length ? t('attnSub') : t('nothingCheck')}</span></button>
      <button class="tile" data-act="filterAnimals" data-f="${pregRole ? esc(pregRole.id) : 'any'}"><span class="tile-num">${preg.length}</span><span class="tile-label">${t('pregnantTile')}</span><span class="tile-sub">${preg[0] && preg[0].p.expected ? esc(t('nextBirth', {d:fmtDate(preg[0].p.expected)})) : t('noneRecorded')}</span></button>
      <button class="tile ${late.length ? 'is-alert' : soon.length ? 'is-warn' : ''}" data-go="vaccines"><span class="tile-num">${late.length + soon.length}</span><span class="tile-label">${t('vaxDue')}</span><span class="tile-sub ${late.length ? 'strong' : ''}">${late.length ? t('nLate', {n:late.length}) : ''}${t('nSoon', {n:soon.length})}</span></button>
    </div>

    ${att.length ? `<section class="sec"><div class="sec-h"><h2>${t('needsAttention')}</h2></div><div class="alist">${att.map(a => animalCard(a, {note:true})).join('')}</div></section>` : ''}

    ${(late.length || soon.length) ? `<section class="sec"><div class="sec-h"><h2>${t('vaxDue')}</h2><button class="link" data-go="vaccines">${t('seeAll')}</button></div><div class="vlist">${[...late, ...soon].slice(0,5).map(vaxRow).join('')}</div></section>` : ''}

    ${preg.length ? `<section class="sec"><div class="sec-h"><h2>${t('expecting')}</h2></div><div class="vlist">${preg.map(({a,p}) => {
      const d = p.expected ? diffDays(todayISO(), p.expected) : null;
      return `<div class="vrow"><button class="vrow-main" data-go="animal/${esc(a.id)}/status"><span class="vrow-top">${tagHTML(a,'tag-sm')}${a.name ? `<span class="aname">${esc(aName(a))}</span>` : ''}<span class="meta">${esc(spName(a))}</span></span><span class="due ${d !== null && d < 0 ? 'late' : d !== null && d <= 14 ? 'soon' : 'ok'}">${p.expected ? esc(t('birthAbout', {d:fmtDate(p.expected)})) + ' · ' + esc(whenText(d)) : t('pregnantWord')}</span></button></div>`;
    }).join('')}</div></section>` : ''}

    <section class="sec">
      <div class="sec-h"><h2>${t('yourHerd')}</h2><span class="count">${esc(t('animalsN', {n:herd.length}))}</span></div>
      ${spCounts.length > 1 ? `<div class="fchips" role="group" aria-label="${esc(t('showType'))}">
        <button class="fchip" data-act="homeType" data-v="all" aria-pressed="${r.type === 'all'}">${t('all')} <span class="n">${act.length}</span></button>
        ${spCounts.map(x => `<button class="fchip" data-act="homeType" data-v="${esc(x.sp.id)}" aria-pressed="${r.type === x.sp.id}">${esc(spLabel(x.sp))} <span class="n">${x.n}</span></button>`).join('')}
      </div>` : ''}
      ${herd.length ? `<div class="alist">${herd.map(a => animalCard(a, {kids:true})).join('')}</div>` : `<p class="empty-note">${t('emptyHerd')}</p>${A().length ? '' : `<div class="notice"><p><b>${t('tryFirst')}</b> ${esc(t('loadSamplesHint', {n:Object.keys(SAMPLE_ANIMALS).length}))}</p><div><button class="btn btn-sm" data-act="loadSamples">${t('loadSamples')}</button></div></div>`}`}
    </section>`;
  return {brand:true, right:langBtn(), html};
};

SCREENS.animals = r => {
  r.type = r.type || 'all'; r.st = r.st || 'any'; r.q = r.q || '';
  const all = A();
  const counts = sortedSpecies().map(sp => ({sp, n:all.filter(a => a.speciesId === sp.id && (r.past || isActive(a))).length}));
  const html = `
    <div class="filter-row">
      <div class="searchbox">${ico('search')}<label for="a-q" class="sr-only">${t('searchLbl')}</label><input id="a-q" class="input" type="search" dir="auto" placeholder="${esc(t('searchPh'))}" value="${esc(r.q)}" autocomplete="off" spellcheck="false"></div>
      <div class="fchips" role="group" aria-label="${esc(t('typeLbl'))}">
        <button class="fchip" data-act="animalsType" data-v="all" aria-pressed="${r.type === 'all'}">${t('allTypes')}</button>
        ${counts.map(x => `<button class="fchip" data-act="animalsType" data-v="${esc(x.sp.id)}" aria-pressed="${r.type === x.sp.id}">${esc(spLabel(x.sp))} <span class="n">${x.n}</span></button>`).join('')}
      </div>
      <div class="field"><label class="lbl" for="a-st">${t('statusLbl')}</label>
        <select id="a-st" class="input">
          <option value="any" ${r.st === 'any' ? 'selected' : ''}>${t('anyStatus')}</option>
          <option value="attention" ${r.st === 'attention' ? 'selected' : ''}>${t('needsAttention')}</option>
          <option value="none" ${r.st === 'none' ? 'selected' : ''}>${t('noStatus')}</option>
          ${sortedStatuses().map(s => `<option value="${esc(s.id)}" ${r.st === s.id ? 'selected' : ''}>${esc(stLabel(s))}</option>`).join('')}
        </select>
      </div>
      <label class="check" for="a-past"><input type="checkbox" id="a-past" ${r.past ? 'checked' : ''}><span><b>${t('showPast')}</b><span class="hint">${t('showPastHint')}</span></span></label>
    </div>
    <div class="sec" style="margin-top:1.2rem"><div class="sec-h"><h2 id="a-count"></h2></div><div class="alist" id="a-list"></div></div>`;
  const draw = () => {
    let list = A();
    const stD = statusDef(r.st);
    if(!r.past && !(stD && stD.leavesHerd)) list = list.filter(isActive);
    if(r.type !== 'all') list = list.filter(a => a.speciesId === r.type);
    if(r.st === 'attention') list = list.filter(a => attention(a).length);
    else if(r.st === 'none') list = list.filter(a => !(a.statuses || []).length);
    else if(r.st !== 'any') list = list.filter(a => (a.statuses || []).some(s => s.statusId === r.st));
    const q = r.q.trim().toLowerCase();
    if(q) list = list.filter(a => String(a.tag).toLowerCase().includes(q) || String(a.name || '').toLowerCase().includes(q) || aName(a).toLowerCase().includes(q));
    list.sort(byTag);
    $('#a-count').textContent = t('animalsN', {n:list.length});
    $('#a-list').innerHTML = list.length ? list.map(a => animalCard(a, {kids:true})).join('') : `<p class="empty-note">${t('noMatch')} ${q ? t('noMatchQ') : t('noMatchF')}</p>`;
  };
  return {title:t('animalsTitle'), html, right:`<button class="btn btn-sm btn-primary" data-act="addNew">${ico('plus')}${t('add')}</button>`, mount(){
    draw();
    $('#a-q').addEventListener('input', e => { r.q = e.target.value; draw(); });
    $('#a-st').addEventListener('change', e => { r.st = e.target.value; draw(); });
    $('#a-past').addEventListener('change', e => { r.past = e.target.checked; draw(); });
  }};
};

SCREENS.animal = r => {
  const a = animal(r.id);
  if(!a) return {title:t('notFound'), html:`<p class="empty-note">${t('goneAnimal')}</p><div class="mt"><button class="btn" data-act="back">${t('goBack')}</button></div>`};
  const tabs = [['overview','tOverview'],['family','tFamily'],['status','tStatus'],['vaccines','tVaccines']];
  const kidsN = children(a.id).length;
  const head = `
    <div class="phead">
      <button class="photo-lg" data-act="${a.hasPhoto ? 'viewPhoto' : 'editAnimal'}" data-id="${esc(a.id)}" aria-label="${esc(a.hasPhoto ? t('viewPhoto') : t('addPhoto'))}">
        ${safeImg(a.thumb) ? `<img id="p-photo" src="${safeImg(a.thumb)}" alt="${esc(t('photoOf', {x:label(a)}))}">` : `<span class="ph">${ico('camera')}${t('addPhoto')}</span>`}
      </button>
      <div class="phead-b">
        <div>${tagHTML(a,'tag-lg')}</div>
        ${a.name ? `<h2 class="pname">${esc(aName(a))}</h2>` : ''}
        <p class="pmeta">${esc(metaLine(a))}</p>
        <div class="chips">${(a.statuses || []).length ? statusChips(a) : `<span class="meta">${t('noCurrentStatus')}</span>`}${!isActive(a) ? `<span class="past-l">${t('pastAnimal')}</span>` : ''}</div>
      </div>
    </div>
    <div class="subtabs" role="tablist" id="subtabs">${tabs.map(([k,l]) => `<button class="subtab" role="tab" data-act="atab" data-v="${k}" aria-selected="${r.tab === k}">${t(l)}${k === 'family' && kidsN ? ` (${kidsN})` : ''}</button>`).join('')}</div>`;
  const panel = ({overview:panelOverview, family:panelFamily, status:panelStatus, vaccines:panelVaccines}[r.tab] || panelOverview)(a);
  return {title:a.tag, right:`<button class="btn btn-sm" data-act="editAnimal" data-id="${esc(a.id)}">${ico('pencil')}${t('edit')}</button>`, html: head + `<div class="panel" role="tabpanel">${panel}</div>`, mount(){
    if(a.hasPhoto){ Store.getPhoto(a.id).then(src => { const img = $('#p-photo'); if(src && img && cur().id === a.id) img.src = src; }); }
  }};
};

function panelOverview(a){
  const dam = animal(a.damId), sire = animal(a.sireId), p = pregInfo(a);
  const nexts = isActive(a) ? rulesFor(a).map(r => ({r, n:nextDue(a, r)})).filter(x => x.n && !x.n.done).sort((x,y) => x.n.due.localeCompare(y.n.due)) : [];
  const nx = nexts[0];
  const young = youngOf(species(a.speciesId));
  const parentLink = (x, isM) => x ? `<button class="btn-inline" data-go="animal/${esc(x.id)}">${tagHTML(x,'tag-sm')}${x.name ? esc(aName(x)) : ''}</button>` : `<button class="link" data-act="${isM ? 'linkDam' : 'linkSire'}" data-id="${esc(a.id)}">${isM ? t('linkMother') : t('linkFather')}</button>`;
  const muted = s => `<span class="meta">${s}</span>`;
  const rows = [
    [t('rId'), tagHTML(a,'tag-sm')],
    [t('rName'), a.name ? esc(aName(a)) : muted(t('notSet'))],
    [t('rType'), esc(spName(a))],
    [t('rSex'), sexWord(a.sex) || muted(t('notSet'))],
    [t('rBorn'), a.birthDate ? `${esc(fmtDate(a.birthDate))}<br><span class="meta">${esc(t('ageOld', {a:ageText(a.birthDate)}))}</span>` : muted(t('notKnown'))],
    [t('rBreed'), a.breed ? esc(tx(a.breed)) : muted(t('notSet'))],
    [t('rMother'), parentLink(dam, true)],
    [t('rFather'), parentLink(sire, false)],
    [t('rReg'), esc(fmtDate((a.createdAt || '').slice(0,10)))],
    [t('rNotes'), a.notes ? `<span dir="auto">${esc(tx(a.notes)).replace(/\n/g,'<br>')}</span>` : muted(t('none'))]
  ];
  const nd = nx ? diffDays(todayISO(), nx.n.due) : 0;
  return `
    <div class="qa">
      <button class="btn" data-act="addStatus" data-id="${esc(a.id)}">${ico('pulse')}${t('addStatus')}</button>
      <button class="btn" data-act="giveVax" data-id="${esc(a.id)}">${ico('syringe')}${t('recordVax')}</button>
      ${a.sex === 'F' || a.sex === 'M' ? `<button class="btn" data-act="addOffspring" data-id="${esc(a.id)}">${ico('family')}${esc(t('registerYoung', {y:young}))}</button>` : `<button class="btn" data-go="animal/${esc(a.id)}/family">${ico('family')}${t('tFamily')}</button>`}
      <button class="btn" data-act="editAnimal" data-id="${esc(a.id)}">${ico('pencil')}${t('editDetails')}</button>
    </div>
    ${p ? `<div class="callout c-purple"><strong>${esc(t('pregnantSince', {d:fmtDate(p.since)}))}</strong><p>${p.expected ? t('pregExpect', {d:esc(fmtDate(p.expected)), w:esc(whenText(diffDays(todayISO(), p.expected))), g:esc(AR() ? countUnit(p.days,'day') : p.days)}) : t('pregNoLen')}</p></div>` : ''}
    ${nx ? `<button class="vrow" data-go="animal/${esc(a.id)}/vaccines"><span class="vrow-main"><span class="lbl-sm">${t('nextVax')}</span><span class="vname">${esc(ruleLabel(nx.r))}</span><span class="due ${nd < 0 ? 'late' : nd <= 14 ? 'soon' : 'ok'}">${esc(nx.n.never && nd < -30 ? t('noRecordYet') : relDays(nd))} · ${esc(fmtDate(nx.n.due))}</span></span>${ico('chev')}</button>` : ''}
    <h3>${t('details')}</h3>
    <dl class="dl">${rows.map(([k,v]) => `<div class="dl-row"><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}

function famNode(x, role){
  return `<button class="node" data-go="animal/${esc(x.id)}/family">${thumbHTML(x,'sm')}<span class="node-b"><span class="node-role">${esc(role)}</span>${tagHTML(x,'tag-sm')}${x.name ? `<span class="node-name">${esc(aName(x))}</span>` : ''}${!isActive(x) ? `<span class="past-l">${t('past')}</span>` : ''}</span></button>`;
}
function panelFamily(a){
  const dam = animal(a.damId), sire = animal(a.sireId);
  const gps = [[t('mm'), dam && animal(dam.damId)],[t('mf'), dam && animal(dam.sireId)],[t('fm'), sire && animal(sire.damId)],[t('ff'), sire && animal(sire.sireId)]].filter(x => x[1]);
  const kids = children(a.id), sibs = siblings(a);
  const yw = youngOf(species(a.speciesId));
  const emptyParent = (isM) => { const who = isM ? t('rMother') : t('rFather'); return `<button class="node empty" data-act="${isM ? 'linkDam' : 'linkSire'}" data-id="${esc(a.id)}"><span class="node-role">${who}</span><span>${t('notRecorded')}</span><span class="node-add">${esc(t('plusLink', {who}))}</span></button>`; };
  const kidRole = k => { const w = k.sex === 'F' ? t('daughter') : k.sex === 'M' ? t('son') : yw; return k.birthDate ? t('bornOn', {w, d:fmtDate(k.birthDate)}) : w; };
  return `<div class="tree">
    ${gps.length ? `<div class="tier"><h3 class="tier-label">${t('grandparents')}</h3><div class="pair">${gps.map(([rl, x]) => famNode(x, rl)).join('')}</div></div><div class="stem"></div>` : ''}
    <div class="tier"><h3 class="tier-label">${t('parents')}</h3><div class="pair">
      ${dam ? famNode(dam, t('rMother')) : emptyParent(true)}
      ${sire ? famNode(sire, t('rFather')) : emptyParent(false)}
    </div></div>
    <div class="stem"></div>
    <div class="node self">${thumbHTML(a,'sm')}<span class="node-b"><span class="node-role">${t('thisAnimal')}</span>${tagHTML(a,'tag-sm')}${a.name ? `<span class="node-name">${esc(aName(a))}</span>` : ''}</span></div>
    <div class="stem"></div>
    <div class="tier"><h3 class="tier-label">${esc(t('offspringTier', {n:kids.length, plural:pluralWord(yw, kids.length)}))}</h3>
      ${kids.length ? `<div class="kids-grid">${kids.map(k => famNode(k, kidRole(k))).join('')}</div>` : `<p class="empty-note">${t('noOffspring')}</p>`}
      <div class="btn-row">
        ${a.sex === 'F' || a.sex === 'M' ? `<button class="btn btn-primary" data-act="addOffspring" data-id="${esc(a.id)}">${ico('plus')}${esc(t('registerNewYoung', {y:yw}))}</button>
        <button class="btn" data-act="linkChild" data-id="${esc(a.id)}">${t('linkExisting')}</button>` : `<p class="hint">${t('setSexFirst')}</p>`}
      </div>
    </div>
    ${sibs.length ? `<div class="tier" style="margin-top:1.6rem"><h3 class="tier-label">${t('siblings')}</h3><div class="kids-grid">${sibs.map(({s, rel}) => famNode(s, rel)).join('')}</div></div>` : ''}
  </div>`;
}

function panelStatus(a){
  const now = a.statuses || [];
  const log = [...(a.statusLog || [])].reverse();
  const p = pregInfo(a);
  return `
    <button class="btn btn-primary btn-block btn-lg" data-act="addStatus" data-id="${esc(a.id)}">${ico('plus')}${t('addStatus')}</button>
    <h3>${t('currentStatus')}</h3>
    ${now.length ? `<div class="stlist">${now.map(s => {
      const d = statusDef(s.statusId);
      const since = s.since ? t('sinceN', {d:fmtDate(s.since), n:countUnit(Math.max(0, diffDays(s.since, todayISO())), 'day')}) : '';
      const extra = d && d.role === 'pregnant' && p && p.expected ? `<span class="meta">${esc(t('birthExpectedShort', {d:fmtDate(p.expected)}))}</span>` : '';
      return `<div class="strow"><div class="strow-b"><div class="chips">${chip(d ? d.color : 'grey', stLabel(d))}</div><span class="meta">${esc(since)}</span>${extra}${s.note ? `<span class="t-note" dir="auto">${esc(tx(s.note))}</span>` : ''}</div><button class="btn btn-sm" data-act="removeStatus" data-id="${esc(a.id)}" data-st="${esc(s.statusId)}">${t('remove')}</button></div>`;
    }).join('')}</div>` : `<p class="empty-note">${t('noStatusNow')}</p>`}
    <h3>${t('history')}</h3>
    ${log.length ? `<ul class="timeline">${log.map(e => {
      const d = statusDef(e.statusId); const name = d ? stLabel(d) : (e.name || t('deletedStatus'));
      return `<li><span class="t-date">${esc(fmtDate(e.date))}</span><span class="t-body"><span><b>${e.action === 'removed' ? t('removedW') : t('addedW')}</b> ${chip(d ? d.color : 'grey', name)}</span>${e.note ? `<span class="t-note" dir="auto">${esc(tx(e.note))}</span>` : ''}</span><span></span></li>`;
    }).join('')}</ul>` : `<p class="empty-note">${t('noStatusChanges')}</p>`}`;
}

function panelVaccines(a){
  const active = isActive(a);
  const rules = rulesFor(a);
  const recs = [...(a.vaccinations || [])].sort((x,y) => (y.date || '').localeCompare(x.date || ''));
  const td = todayISO();
  const sp = species(a.speciesId);
  const dueRows = rules.map(r => {
    const n = nextDue(a, r);
    if(n.done) return `<div class="vrow"><div class="vrow-main"><span class="vname">${esc(ruleLabel(r))}</span><span class="due ok">${esc(t('allDoses', {d:fmtDate(n.last)}))}</span></div><span></span></div>`;
    const d = diffDays(td, n.due);
    const txt = n.never && d < -30 ? t('noRecordYet') : relDays(d);
    return `<div class="vrow"><div class="vrow-main"><span class="vname">${esc(ruleLabel(r))} <span class="meta">· ${esc(doseLabel(r, n))}</span></span><span class="due ${d < 0 ? 'late' : d <= 14 ? 'soon' : 'ok'}">${esc(txt)} · ${esc(fmtDate(n.due))}</span>${n.last ? `<span class="meta">${esc(t('lastGiven', {d:fmtDate(n.last)}))}</span>` : ''}</div><button class="btn btn-sm" data-act="giveVax" data-id="${esc(a.id)}" data-rule="${esc(r.id)}">${t('markGiven')}</button></div>`;
  }).join('');
  return `
    <button class="btn btn-primary btn-block btn-lg" data-act="giveVax" data-id="${esc(a.id)}">${ico('syringe')}${t('recordAVax')}</button>
    <h3>${t('reminders')}</h3>
    ${!active ? `<p class="empty-note">${t('remindersOff')}</p>` :
      rules.length ? `<div class="vlist">${dueRows}</div>` : `<p class="empty-note">${esc(t('noRulesFor', {plural:spPlural(sp), name:spName(a)}))} <button class="link" data-go="rule/new/${esc(a.speciesId)}">${t('addVaxRuleLink')}</button></p>`}
    ${a.birthDate ? '' : (active && rules.length ? `<p class="hint">${t('addBirthHint')}</p>` : '')}
    <h3>${t('vaxGiven')}</h3>
    ${recs.length ? `<ul class="timeline">${recs.map(v => `<li><span class="t-date">${esc(fmtDate(v.date))}</span><span class="t-body"><b dir="auto">${esc(vxName(v))}</b>${v.note ? `<span class="t-note" dir="auto">${esc(tx(v.note))}</span>` : ''}</span><button class="icon-btn" data-act="delVax" data-id="${esc(a.id)}" data-v="${esc(v.id)}" aria-label="${esc(t('delRecord'))}">${ico('trash')}</button></li>`).join('')}</ul>` : `<p class="empty-note">${t('noVaxYet')}</p>`}`;
}

/* ---- animal form ---- */

    const pre = r.preset || {};
    r.draft = a ? {tag:a.tag, name:a.name || '', speciesId:a.speciesId, sex:a.sex || '', birthDate:a.birthDate || '', breed:a.breed || '', damId:a.damId || '', sireId:a.sireId || '', notes:a.notes || '', thumb:a.thumb || '', photoFull:null, photoChanged:false, hadPhoto:!!a.hasPhoto, markMother:true}
      : {tag:'', name:'', speciesId:pre.speciesId || (Store.data.species.size === 1 ? sortedSpecies()[0].id : ''), sex:'', birthDate:'', breed:pre.breed || '', damId:pre.damId || '', sireId:pre.sireId || '', notes:'', thumb:'', photoFull:null, photoChanged:false, hadPhoto:false, markMother:true};
  }
  const d = r.draft;
  const dam = animal(d.damId), sire = animal(d.sireId);
  const birthRole = roleStatus('birth'), pregRole = roleStatus('pregnant');
  const showMark = () => !editing && !!animal(d.damId) && !!birthRole && d.birthDate && diffDays(d.birthDate, todayISO()) <= 14 && diffDays(d.birthDate, todayISO()) >= 0;
  const parentBtn = (x, isM) => `<div class="parent-pick"><span class="lbl-sm">${isM ? t('rMother') : t('rFather')}</span><div class="parent-line">
      <button type="button" class="pbtn" data-act="${isM ? 'pickDam' : 'pickSire'}">${x ? `${thumbHTML(x,'sm')}<span class="node-b">${tagHTML(x,'tag-sm')}${x.name ? `<span class="node-name">${esc(aName(x))}</span>` : ''}</span>` : `<span class="choose">${isM ? t('chooseMother') : t('chooseFather')}</span>`}</button>
      ${x ? `<button type="button" class="btn btn-sm" data-act="${isM ? 'clearDam' : 'clearSire'}">${t('remove')}</button>` : ''}
    </div></div>`;
  const html = `
    <form id="aform" class="form" novalidate>

function loadImg(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function toJpeg(img, maxSide, q, square){
  let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
  if(square){ const s = Math.min(sw, sh); sx = (sw - s)/2; sy = (sh - s)/2; sw = sh = s; }
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*scale)), h = Math.max(1, Math.round(sh*scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
async function processPhoto(file){
  const img = await loadImg(file);
  let full = toJpeg(img, 1000, .78);
  if(full.length > 190000) full = toJpeg(img, 760, .7);
  if(full.length > 190000) full = toJpeg(img, 560, .62);
  const thumb = toJpeg(img, 150, .7, true);
  return {full, thumb};
}

function saveAnimal(r){
  const d = r.draft, errs = [];
  const tag = String(d.tag || '').trim();
  if(!tag) errs.push(['f-tag', t('enterId')]);
  else {
    const dup = A().find(x => x.id !== r.id && String(x.tag).trim().toLowerCase() === tag.toLowerCase());
    if(dup) errs.push(['f-tag', t('idUsed', {tag, who:label(dup), sp:spName(dup)})]);
  }
  if(!d.speciesId || !species(d.speciesId)) errs.push(['f-species', t('chooseType')]);
  if(d.birthDate && d.birthDate > todayISO()) errs.push(['f-birth', t('futureBirth')]);
  const box = $('#f-err');
  document.querySelectorAll('.input.bad').forEach(x => x.classList.remove('bad'));
  if(errs.length){
    box.innerHTML = `${esc(t('fixBefore', {n:errs.length}))}<ul>${errs.map(e => `<li>${esc(e[1])}</li>`).join('')}</ul>`;
    box.hidden = false;
    errs.forEach(([id]) => { const el = document.getElementById(id); if(el && el.classList.contains('input')) el.classList.add('bad'); });
    box.scrollIntoView({block:'center'});
    return;
  }
  const id = r.id || uid('a');
  const base = r.id ? clone(animal(r.id)) : {createdAt:new Date().toISOString(), statuses:[], statusLog:[], vaccinations:[]};
  Object.assign(base, {tag, name:String(d.name || '').trim(), speciesId:d.speciesId, sex:d.sex || 'U', birthDate:d.birthDate || '', breed:String(d.breed || '').trim(), damId:d.damId || '', sireId:d.sireId || '', notes:String(d.notes || '').trim(), thumb:d.thumb || '', hasPhoto:!!d.thumb});
  Store.put('animals', id, base);
  if(d.photoChanged){ if(d.photoFull) Store.setPhoto(id, d.photoFull); else if(d.hadPhoto) Store.removePhoto(id); }
  const markEl = $('#f-mark-wrap');
  if(!r.id && d.damId && d.markMother && markEl && !markEl.hidden){
    const br = roleStatus('birth'), mom = animal(d.damId);
    if(br && mom && !(mom.statuses || []).some(s => s.statusId === br.id)) applyStatus(mom.id, br.id, d.birthDate || todayISO(), t('gaveBirthTo', {x:tag}));
  }
  toast(r.id ? t('changesSaved') : t('xSaved', {x:tag}));
  r.dirty = false;
  if(r.id){ back(true); }
  else { S.stack[S.stack.length-1] = {s:'animal', id, tab:'overview'}; render(); window.scrollTo(0,0); }
}

function applyStatus(aid, stId, date, note){
  const a = clone(animal(aid)), st = statusDef(stId); if(!a || !st) return;
  a.statuses = a.statuses || []; a.statusLog = a.statusLog || [];
  const log = (sid, action, nt) => a.statusLog.push({statusId:sid, name:statusDef(sid)?.name || '', action, date, note:nt || ''});
  if(st.leavesHerd){ a.statuses.forEach(s => log(s.statusId, 'removed', t('clearedWhen', {s:stLabel(st)}))); a.statuses = []; }
  if(st.role === 'birth'){ const p = a.statuses.find(s => statusDef(s.statusId)?.role === 'pregnant'); if(p){ a.statuses = a.statuses.filter(s => s !== p); log(p.statusId, 'removed', t('gaveBirth')); } }
  a.statuses = a.statuses.filter(s => s.statusId !== stId);
  a.statuses.push({statusId:stId, since:date, note:note || ''});
  log(stId, 'added', note);
  if(a.statusLog.length > 300) a.statusLog = a.statusLog.slice(-300);
  Store.put('animals', aid, a);
}
function dropStatus(aid, stId, date, note){
  const a = clone(animal(aid)); if(!a) return;
  a.statuses = (a.statuses || []).filter(s => s.statusId !== stId);
  a.statusLog = a.statusLog || [];
  a.statusLog.push({statusId:stId, name:statusDef(stId)?.name || '', action:'removed', date, note:note || ''});
  Store.put('animals', aid, a);
}

    body = !Store.data.vaccines.size ? `<p class="empty-note">${t('noRulesYet')}</p><button class="btn btn-primary" data-go="rule/new">${ico('plus')}${t('addVaxRule')}</button>`
      : (late.length + soon.length + next.length) ? grp(t('gLate'), 'red', late) + grp(t('gSoon'), 'amber', soon) + grp(t('gNext'), 'green', next)
      : `<p class="empty-note">${t('allUpToDate')}</p>`;
  } else if(r.tab === 'history'){
    const recs = [];
    A().forEach(a => (a.vaccinations || []).forEach(v => recs.push({a, v})));
    recs.sort((x,y) => (y.v.date || '').localeCompare(x.v.date || ''));
    body = recs.length ? `<ul class="timeline">${recs.slice(0,150).map(({a, v}) => `<li><span class="t-date">${esc(fmtDate(v.date))}</span><span class="t-body"><span><button class="btn-inline" style="min-height:auto" data-go="animal/${esc(a.id)}/vaccines">${tagHTML(a,'tag-sm')}</button> ${a.name ? esc(aName(a)) : ''}</span><b dir="auto">${esc(vxName(v))}</b>${v.note ? `<span class="t-note" dir="auto">${esc(tx(v.note))}</span>` : ''}</span><span></span></li>`).join('')}</ul>${recs.length > 150 ? `<p class="hint">${t('latest150')}</p>` : ''}` : `<p class="empty-note">${t('noVaxYet')}</p>`;
  } else {
    const rules = [...Store.data.vaccines.values()];
    body = `<p class="hint" style="margin:0">${t('rulesIntro')}</p>
      <button class="btn btn-primary btn-block" data-go="rule/new">${ico('plus')}${t('addVaxRule')}</button>
      ${sortedSpecies().map(sp => { const list = rules.filter(x => x.speciesId === sp.id).sort((a,b) => ruleLabel(a).localeCompare(ruleLabel(b))); return `<p class="group-h">${esc(spLabel(sp))}</p>${list.length ? `<div class="vlist">${list.map(x => `<button class="rule-card" data-go="rule/${esc(x.id)}"><span class="rule-top"><b>${esc(ruleLabel(x))}</b>${x.example ? `<span class="past-l">${t('exampleL')}</span>` : ''}</span><p class="meta">${esc(ruleText(x))}</p></button>`).join('')}</div>` : `<p class="empty-note">${esc(t('noRulesForType', {plural:spPlural(sp)}))} <button class="link" data-go="rule/new/${esc(sp.id)}">${t('addOne')}</button></p>`}`; }).join('')}`;
  }
  const html = `<div class="subtabs" role="tablist" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0">${tabs.map(([k,l]) => `<button class="subtab" role="tab" data-act="vtab" data-v="${k}" aria-selected="${r.tab === k}">${t(l)}</button>`).join('')}</div><div class="panel" role="tabpanel">${body}</div>`;
  return {title:t('vaxTitle'), html};
};

  if(!r.draft){
    const p = (v, dn, du) => v && v.n ? {n:String(v.n), u:v.u} : {n:dn, u:du};
    r.draft = x ? {name:ruleLabel(x), speciesId:x.speciesId, sex:x.sex || 'all', first:p(x.first,'0','weeks'), booster:p(x.booster,'','weeks'), repeat:p(x.repeat,'','months'), notes:x.example && x.notes === EX_NOTE ? '' : (x.notes || '')}
      : {name:'', speciesId:(r.preset && r.preset.speciesId) || '', sex:'all', first:{n:'8',u:'weeks'}, booster:{n:'',u:'weeks'}, repeat:{n:'12',u:'months'}, notes:''};
  }
  const d = r.draft;
  const unitSel = key => `<div class="unit-row"><label class="sr-only" for="ru-${key}-n">${t('number')}</label><input id="ru-${key}-n" data-k="${key}" data-p="n" class="input" inputmode="numeric" pattern="[0-9]*" value="${esc(d[key].n)}" placeholder="—"><label class="sr-only" for="ru-${key}-u">${t('unit')}</label><select id="ru-${key}-u" data-k="${key}" data-p="u" class="input">${UNITS.map(k => `<option value="${k}" ${d[key].u === k ? 'selected' : ''}>${t('unit_' + k)}</option>`).join('')}</select></div>`;
  const toRule = () => ({name:d.name, sex:d.sex, first:{n:Number(d.first.n)||0, u:d.first.u}, booster:Number(d.booster.n) ? {n:Number(d.booster.n), u:d.booster.u} : null, repeat:Number(d.repeat.n) ? {n:Number(d.repeat.n), u:d.repeat.u} : null});
  const html = `<form id="rform" class="form" novalidate>
    <div class="err" id="r-err" hidden></div>
    <div class="field"><label class="lbl" for="r-name">${t('vaxName')} <span class="req">${t('required')}</span></label><input id="r-name" name="name" class="input" dir="auto" value="${esc(d.name)}" autocomplete="off" placeholder="${esc(t('vaxNamePh'))}"></div>
    <fieldset class="field"><legend class="lbl">${t('forWhich')} <span class="req">${t('required')}</span></legend><div class="opts">${sortedSpecies().map(sp => `<label class="opt"><input type="radio" name="speciesId" value="${esc(sp.id)}" ${d.speciesId === sp.id ? 'checked' : ''}><span>${esc(spLabel(sp))}</span></label>`).join('')}</div></fieldset>
    <fieldset class="field"><legend class="lbl">${t('giveTo')}</legend><div class="opts">${[['all','all'],['F','femalesOnly'],['M','malesOnly']].map(([v,l]) => `<label class="opt"><input type="radio" name="sex" value="${v}" ${d.sex === v ? 'checked' : ''}><span>${t(l)}</span></label>`).join('')}</div></fieldset>
    <div class="field"><span class="lbl">${t('firstAge')}</span>${unitSel('first')}<span class="hint">${t('firstAgeHint')}</span></div>
    <div class="field"><span class="lbl">${t('secondDose')} <span class="req">${t('optional')}</span></span>${unitSel('booster')}<span class="hint">${t('secondHint')}</span></div>
    <div class="field"><span class="lbl">${t('repeatEvery')} <span class="req">${t('optional')}</span></span>${unitSel('repeat')}<span class="hint">${t('repeatHint')}</span></div>
    <p class="preview-line" id="r-prev" aria-live="polite"></p>
    <div class="field"><label class="lbl" for="r-notes">${t('rNotes')} <span class="req">${t('optional')}</span></label><textarea id="r-notes" name="notes" class="input" dir="auto" placeholder="${esc(t('ruleNotesPh'))}">${esc(d.notes)}</textarea></div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">${x ? t('saveChanges') : t('saveRule')}</button>
    ${x ? `<button type="button" class="btn btn-danger btn-block" data-act="deleteRule" data-id="${esc(x.id)}">${ico('trash')}${t('deleteRule')}</button>` : ''}
  </form>`;
  return {title: x ? t('editRule') : t('newRule'), html, mount(){
    const f = $('#rform');
    const prev = () => { $('#r-prev').textContent = t('planPrefix') + ruleText(toRule()); };
    const onF = e => { const el = e.target; r.dirty = true; if(el.dataset.k){ d[el.dataset.k][el.dataset.p] = el.dataset.p === 'n' ? el.value.replace(/[^0-9]/g,'') : el.value; } else if(el.name){ if(el.type === 'radio'){ if(el.checked) d[el.name] = el.value; } else d[el.name] = el.value; } prev(); };
    f.addEventListener('input', onF); f.addEventListener('change', onF); prev();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const errs = [];
      if(!d.name.trim()) errs.push(t('enterVaxName'));
      if(!species(d.speciesId)) errs.push(t('chooseWhich'));
      if(errs.length){ const b = $('#r-err'); b.innerHTML = `${esc(t('fixPlain'))}<ul>${errs.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`; b.hidden = false; b.scrollIntoView({block:'center'}); return; }

      Store.put('vaccines', rid, out);
      r.dirty = false; toast(t('ruleSaved')); back(true);
    });

};
